# Builds and tests VCF Lite on macOS, Windows and Linux.
#
# Every push / pull request (and manual runs): run the tests, build every
# platform, and self-test each build (the app opens tests/data/sample.vcf.gz
# in a real window and checks rows appear).
# Pushing a tag like v0.1.0 additionally publishes a GitHub Release with the
# files the website links to (fixed names, so .../releases/latest/download/<name>
# always serves the newest build):
#   VCF-Lite-macOS-arm64.dmg  VCF-Lite-macOS-x64.dmg
#   VCF-Lite-Windows-x64-Setup.exe  VCF-Lite-Linux.deb  SHA256SUMS.txt
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYWEBVIEW: pywebview==6.2.1
  PYINSTALLER: pyinstaller==6.22.3

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: sudo apt-get update && sudo apt-get install -y tabix bcftools
      - run: pip install pytest
      - run: python -m pytest -q

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200  # Apple's notarization can be slow for new accounts
    env:
      # Developer ID signing + notarization happen when these secrets exist
      # (they don't for pull requests from forks, which then build unsigned).
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "$PYWEBVIEW" "$PYINSTALLER"
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [ -n "$ID" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "Signing as: $ID"
          { echo "KEYCHAIN=$KC"; echo "MACOS_SIGN_IDENTITY=$ID"; } >> "$GITHUB_ENV"
      - name: Build app + dmg (signed and notarized when the secrets exist)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: PYTHON=python ./scripts/build.sh
      - name: Check it opens cleanly (as Gatekeeper sees it)
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        run: |
          set -x
          spctl -a -vvv -t exec "dist/VCF Lite.app" 2>&1 | tee gk-app.txt
          grep -q "source=Notarized Developer ID" gk-app.txt
          spctl -a -vvv -t open --context context:primary-signature dist/*.dmg 2>&1 | tee gk-dmg.txt
          grep -q "source=Notarized Developer ID" gk-dmg.txt
          xcrun stapler validate dist/*.dmg
      - name: Releases must be signed
        if: startsWith(github.ref, 'refs/tags/v') && (env.HAS_SIGNING != 'true' || env.HAS_NOTARY != 'true')
        run: |
          echo "::error::release builds must be signed and notarized; set the MACOS_CERT_* and APPLE_* secrets"
          exit 1
      - name: Self-test the built app
        run: '"dist/VCF Lite.app/Contents/MacOS/VCF Lite" tests/data/sample.vcf.gz --selftest'
      - name: Collect
        run: |
          mkdir -p out
          cp dist/*.dmg "out/VCF-Lite-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with: { name: "macos-${{ matrix.arch }}", path: out/* }
      # If notarization didn't finish (or anything else failed after signing),
      # keep the signed dmg and its Apple submission id: once Apple accepts it,
      # `xcrun stapler staple` completes it without a new submission.
      - name: Keep the signed dmg if the job failed
        if: failure() && env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: "unfinished-macos-${{ matrix.arch }}"
          path: |
            dist/*.dmg
            dist/notary-submission.txt
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "$env:PYWEBVIEW" "$env:PYINSTALLER"
      - name: Build app
        run: python -m PyInstaller packaging/vcflite.spec --noconfirm --clean --distpath dist --workpath build
      - name: Self-test the built app
        shell: pwsh
        run: |
          $env:VCFLITE_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "dist\VCF Lite\VCF Lite.exe" -ArgumentList '"tests\data\sample.vcf.gz"','--selftest' -PassThru -Wait
          Get-Content selftest.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
      - name: Build installer
        shell: pwsh
        run: |
          # Microsoft's WebView2 bootstrapper, bundled for PCs that lack the runtime.
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile build\MicrosoftEdgeWebview2Setup.exe
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          $ver = python -c "import vcflite; print(vcflite.__version__)"
          iscc "/DAppVersion=$ver" packaging\windows\vcflite.iss
      - name: Install silently and self-test the installed app
        shell: pwsh
        run: |
          $i = Start-Process -FilePath "dist\VCF-Lite-Windows-x64-Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "installer failed (exit $($i.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\VCF Lite\VCF Lite.exe"
          $env:VCFLITE_SELFTEST_OUT = "$PWD\selftest-installed.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '"tests\data\sample.vcf.gz"','--selftest' -PassThru -Wait
          Get-Content selftest-installed.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "installed app self-test failed (exit $($p.ExitCode))" }
      - uses: actions/upload-artifact@v7
        with: { name: windows-x64, path: dist/VCF-Lite-Windows-x64-Setup.exe }

  linux-build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/build_deb.py
      - run: mkdir -p out && cp dist/vcf-lite_*_all.deb out/VCF-Lite-Linux.deb
      - uses: actions/upload-artifact@v7
        with: { name: linux-deb, path: out/VCF-Lite-Linux.deb }

  # Install the .deb with apt on clean Ubuntu releases (this also checks the
  # declared dependencies are right) and self-test it under a virtual display.
  linux-test:
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: linux-deb }
      - run: sudo apt-get update && sudo apt-get install -y xvfb ./VCF-Lite-Linux.deb
      - name: Self-test the installed app
        run: |
          if ! xvfb-run -a vcf-lite tests/data/sample.vcf.gz --selftest; then
            # WebKitGTK's sandbox can't start on some CI runners (no user
            # namespaces); retry without it so we learn whether that's the cause.
            echo "::warning::self-test failed; retrying with the WebKit sandbox disabled (CI-only)"
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a vcf-lite tests/data/sample.vcf.gz --selftest
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the app version
        run: |
          ver=$(python3 -c "import vcflite; print(vcflite.__version__)")
          [ "v$ver" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != version v$ver (vcflite/__init__.py)"; exit 1; }
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
